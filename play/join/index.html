<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Guilty Hour</title>
<link rel="canonical" href="https://guiltyhour.github.io/">
<style>
  :root { color-scheme: light dark; --verdict: #C8102E; --paper: #F4F1EA;
          --ink: #14110F; --muted: #5A534A; }
  @media (prefers-color-scheme: dark) {
    :root { --verdict: #A50D26; --paper: #16181C; --ink: #ECE7DE;
            --muted: #A9A298; }
  }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 1.0625rem/1.6 ui-serif, Georgia, serif; }
  main { max-width: 32rem; margin: 0 auto; padding: 3rem 1rem; }
  .code { font: 700 2.4rem system-ui, sans-serif; letter-spacing: .12em;
          color: var(--verdict); margin: .5rem 0 1.5rem; }
  .cta { display: inline-block; background: var(--verdict); color: #fff;
         padding: .85rem 1.3rem; border-radius: .6rem; text-decoration: none;
         font: 700 1rem system-ui, sans-serif; }
  .steps { color: var(--muted); margin-top: 2rem; }
</style>
</head>
<body>
<main>
<h1 id="title">You are invited to a Guilty Hour group</h1>
<p id="lede">Compare the daily case with your friends. No accounts.</p>
<div class="code" id="code"></div>
<a class="cta" id="cta" href="https://play.google.com/store/apps/details?id=com.guiltyhour.app">Get it on Google Play</a>
<p class="steps" id="steps">Once it is installed, open this link again, or go to Today's standings, then Friends, then Join with a code.</p>
</main>
<script>
  var raw = (new URLSearchParams(location.search).get('g') || '')
      .toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  document.getElementById('code').textContent =
      raw.length === 6 ? raw.slice(0, 3) + '-' + raw.slice(3) : '';
  if ((navigator.language || '').toLowerCase().indexOf('es') === 0) {
    document.documentElement.lang = 'es';
    document.getElementById('title').textContent = 'Te han invitado a un grupo de Guilty Hour';
    document.getElementById('lede').textContent = 'Compara el reto diario con tus amigos. Sin cuentas.';
    var cta = document.getElementById('cta');
    cta.textContent = 'Descárgalo en Google Play';
    cta.href += '&hl=es';
    document.getElementById('steps').textContent = 'Cuando lo tengas, vuelve a abrir este enlace, o entra en Clasificación de hoy, Amigos y Unirme con un código.';
  }
</script>
</body>
</html>
